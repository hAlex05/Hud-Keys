name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: Build all Minecraft targets
        run: ./gradlew build
      - name: Verify release JARs and prepare changelog
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/verify_release.py
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          version = json.loads(Path('build/release-manifest.json').read_text())['version']
          assert os.environ['RELEASE_TAG'] == f'v{version}', 'Tag and mod version differ'
          changelog = Path('CHANGELOG.md').read_text()
          notes = changelog.split(f'## {version}\n', 1)[1].split('\n## ', 1)[0].strip()
          Path('build/RELEASE_NOTES.md').write_text(notes + '\n')
          PY
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mapfile -t jars < <(python3 - <<'PY'
          import json
          from pathlib import Path
          for artifact in json.loads(Path('build/release-manifest.json').read_text())['artifacts']:
              print(artifact['file'])
          PY
          )
          args=()
          if [[ "$RELEASE_TAG" == *alpha* || "$RELEASE_TAG" == *beta* || "$RELEASE_TAG" == *rc* ]]; then
            args+=(--prerelease)
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${jars[@]}" build/release-manifest.json --clobber
            gh release edit "$RELEASE_TAG" --notes-file build/RELEASE_NOTES.md
            for target in 26.1 26.1.1 26.1.2; do
              obsolete="hudk-mc${target}-${RELEASE_TAG#v}.jar"
              if gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -Fxq "$obsolete"; then
                gh release delete-asset "$RELEASE_TAG" "$obsolete" --yes
              fi
            done
          else
            gh release create "$RELEASE_TAG" "${jars[@]}" build/release-manifest.json \
              --verify-tag --title "Hud Keys ${RELEASE_TAG#v}" \
              --notes-file build/RELEASE_NOTES.md "${args[@]}"
          fi
