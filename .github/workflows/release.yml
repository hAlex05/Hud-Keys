name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: Build all Minecraft targets
        run: ./gradlew build
      - name: Verify release JARs and prepare changelog
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          ./gradlew verifyRelease
          version=$(jq -r '.version' build/release-manifest.json)
          [[ "$RELEASE_TAG" == "v$version" ]] || { echo 'Tag and mod version differ'; exit 1; }
          awk -v header="## $version" '
            $0 == header { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > build/RELEASE_NOTES.md
          test -s build/RELEASE_NOTES.md
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mapfile -t jars < <(jq -r '.artifacts[].file' build/release-manifest.json)
          args=()
          if [[ "$RELEASE_TAG" == *alpha* || "$RELEASE_TAG" == *beta* || "$RELEASE_TAG" == *rc* ]]; then
            args+=(--prerelease)
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${jars[@]}" build/release-manifest.json --clobber
            gh release edit "$RELEASE_TAG" --notes-file build/RELEASE_NOTES.md
            for target in 26.1 26.1.1 26.1.2; do
              obsolete="hudk-mc${target}-${RELEASE_TAG#v}.jar"
              if gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -Fxq "$obsolete"; then
                gh release delete-asset "$RELEASE_TAG" "$obsolete" --yes
              fi
            done
          else
            gh release create "$RELEASE_TAG" "${jars[@]}" build/release-manifest.json \
              --verify-tag --title "Hud Keys ${RELEASE_TAG#v}" \
              --notes-file build/RELEASE_NOTES.md "${args[@]}"
          fi
