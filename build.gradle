buildscript {
	repositories {
		maven { url = "https://maven.fabricmc.net/" }
	}
	dependencies {
		classpath "net.fabricmc:fabric-loom:${project.loom_version}"
	}
}

plugins {
	id 'maven-publish'
}

if (project.minecraft_version.startsWith("1.21")) {
	apply plugin: 'net.fabricmc.fabric-loom-remap'
} else {
	apply plugin: 'net.fabricmc.fabric-loom'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = "${project.archives_base_name}-mc${project.minecraft_version}"
}

repositories {
	maven {
		name = "Terraformers"
		url = "https://maven.terraformersmc.com/"
	}
	maven {
		name= "shedaniel"
		url = "https://maven.shedaniel.me/" }
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"hudk" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	if (project.minecraft_version.startsWith("1.21")) {
		mappings loom.officialMojangMappings()
		modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
		modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
		modImplementation("com.terraformersmc:modmenu:${project.modmenu_version}")
		modApi ("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}")
	} else {
		implementation "net.fabricmc:fabric-loader:${project.loader_version}"
		implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
		implementation("com.terraformersmc:modmenu:${project.modmenu_version}")
		api ("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}")
	}
}

processResources {
	inputs.property "version", project.version
	inputs.property "minecraft_version", project.minecraft_version
	inputs.property "java_version", project.minecraft_version.startsWith("1.21") ? 21 : 25
	inputs.property "loader_version", project.loader_version
	inputs.property "cloth_config_version", project.cloth_config_version

	filesMatching("fabric.mod.json") {
		expand inputs.properties
	}
}

def javaVersionNum = project.minecraft_version.startsWith("1.21") ? 21 : 25
def jVersion = project.minecraft_version.startsWith("1.21") ? JavaVersion.VERSION_21 : JavaVersion.VERSION_25

tasks.withType(JavaCompile).configureEach {
	it.options.release = javaVersionNum
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = jVersion
	targetCompatibility = jVersion
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from(rootProject.file("LICENSE")) {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
